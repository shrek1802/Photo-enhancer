name: Build Auto Model Packs

on:
  workflow_dispatch:
    inputs:
      pack:
        description: Model pack to build
        required: true
        default: auto-restoration-core
        type: choice
        options:
          - auto-essentials-lite
          - auto-restoration-core
          - auto-portrait-pro
          - auto-heritage
          - auto-social-recovery
          - auto-night-recovery
          - auto-vehicle
          - auto-pet-detail
          - auto-document-repair
          - auto-raw-finish
          - auto-event-match
          - auto-background-repair
          - auto-lens-cleanup
          - auto-motion-recovery
          - auto-bw-colour
      publish:
        description: Publish a GitHub Release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pack metadata
        id: metadata
        shell: bash
        env:
          SELECTED_PACK: ${{ inputs.pack }}
        run: |
          python - <<'PY'
          import json, os
          selected = os.environ['SELECTED_PACK']
          catalog = json.load(open('model_packs/catalog.json', encoding='utf-8'))
          pack = next((item for item in catalog['packs'] if item['pack_id'] == selected), None)
          if pack is None:
              raise SystemExit(f'Unknown pack: {selected}')
          display = pack['name']
          version = pack.get('version', '1.0.0')
          filename = display.replace('&', 'and').replace(' ', '-') + f'-{version}.zip'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'pack_id={selected}\n')
              out.write(f'name={display}\n')
              out.write(f'version={version}\n')
              out.write(f'filename={filename}\n')
              out.write(f'tag=auto-pack-{selected}-v{version}\n')
          print(f'Selected: {display} {version} ({pack.get("status", "unknown")})')
          PY

      - name: Install validation tools
        if: inputs.pack == 'auto-essentials-lite' || inputs.pack == 'auto-restoration-core'
        run: python -m pip install --upgrade onnx onnxruntime

      - name: Build verified neural base
        if: inputs.pack == 'auto-essentials-lite' || inputs.pack == 'auto-restoration-core'
        shell: bash
        env:
          PACK_ID: ${{ steps.metadata.outputs.pack_id }}
          PACK_NAME: ${{ steps.metadata.outputs.name }}
          PACK_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          ROOT="dist-packs/${PACK_ID}"
          mkdir -p "$ROOT/models"

          curl -L --fail --retry 3 \
            "https://huggingface.co/onnxmodelzoo/super-resolution-10/resolve/395472c4b6b92f788357237983d83fd913cfe7e3/super-resolution-10.onnx?download=true" \
            -o "$ROOT/models/super_resolution.onnx"

          echo "85f36ff88cc504a24af5e0602148bc56a8aa09a58eca8c0da2756f3e8186035e  $ROOT/models/super_resolution.onnx" | sha256sum --check

          python - <<'PY'
          import os, onnx, onnxruntime as ort
          path = f"dist-packs/{os.environ['PACK_ID']}/models/super_resolution.onnx"
          onnx.checker.check_model(onnx.load(path))
          session = ort.InferenceSession(path, providers=['CPUExecutionProvider'])
          assert session.get_inputs() and session.get_outputs()
          print('Validated:', session.get_inputs()[0].shape, '->', session.get_outputs()[0].shape)
          PY

          SIZE=$(stat -c%s "$ROOT/models/super_resolution.onnx")
          cat > "$ROOT/models/super_resolution.model.json" <<'EOF'
          {
            "schema_version": 1,
            "capability": "super_resolution",
            "colour_order": "rgb",
            "input_range": "0_1",
            "output_range": "0_1",
            "layout": "nchw",
            "tile_size": 224,
            "tile_overlap": 24,
            "blend_strength": 1.0,
            "output_scale": 3
          }
          EOF

          if [ "$PACK_ID" = "auto-restoration-core" ]; then
            cat > "$ROOT/profile.json" <<'EOF'
          {
            "schema_version": 1,
            "pack_id": "auto-restoration-core",
            "name": "Auto Restoration Core",
            "version": "1.0.0",
            "pack_type": "hybrid-core",
            "scene_hints": ["photo", "portrait", "family", "social", "night", "old", "screenshot"],
            "capabilities": ["jpeg_repair", "denoise", "deblur", "super_resolution"],
            "neural_capabilities": ["super_resolution"],
            "settings": {
              "denoise": 0.34,
              "detail_recovery": 0.25,
              "jpeg_repair": 0.30,
              "highlight_protection": 0.30,
              "shadow_recovery": 0.24
            }
          }
          EOF
          fi

          cat > "$ROOT/manifest.json" <<EOF
          {
            "schema_version": 1,
            "pack_id": "$PACK_ID",
            "name": "$PACK_NAME",
            "version": "$PACK_VERSION",
            "minimum_app_version": "2.3.0",
            "archive_url": "",
            "archive_sha256": "",
            "files": [
              {
                "capability": "super_resolution",
                "filename": "models/super_resolution.onnx",
                "sha256": "85f36ff88cc504a24af5e0602148bc56a8aa09a58eca8c0da2756f3e8186035e",
                "size": $SIZE,
                "providers": ["CUDAExecutionProvider", "DmlExecutionProvider", "CPUExecutionProvider"],
                "required": true,
                "metadata": "models/super_resolution.model.json"
              }
            ]
          }
          EOF

          cat > "$ROOT/THIRD-PARTY-NOTICES.txt" <<'EOF'
          Includes super-resolution-10.onnx from the ONNX Model Zoo mirror on Hugging Face.
          Repository: onnxmodelzoo/super-resolution-10
          Pinned revision: 395472c4b6b92f788357237983d83fd913cfe7e3
          Licence: Apache License 2.0
          SHA-256: 85f36ff88cc504a24af5e0602148bc56a8aa09a58eca8c0da2756f3e8186035e
          EOF

          python validate_neural_pack.py "$ROOT"

      - name: Build specialist processing-profile pack
        if: inputs.pack != 'auto-essentials-lite' && inputs.pack != 'auto-restoration-core'
        shell: bash
        env:
          SELECTED_PACK: ${{ inputs.pack }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          selected = os.environ['SELECTED_PACK']
          catalog = json.load(open('model_packs/catalog.json', encoding='utf-8'))
          profiles = json.load(open('model_packs/profiles.json', encoding='utf-8'))['packs']
          pack = next(item for item in catalog['packs'] if item['pack_id'] == selected)
          profile = profiles[selected]
          root = Path('dist-packs') / selected
          root.mkdir(parents=True, exist_ok=True)
          payload = {
              'schema_version': 1,
              'pack_id': selected,
              'name': profile['name'],
              'version': pack.get('version', '1.0.0'),
              'description': profile['description'],
              'scene_hints': profile.get('scene_hints', []),
              'capabilities': profile.get('capabilities', []),
              'settings': profile.get('settings', {}),
              'depends_on': pack.get('depends_on', []),
              'pack_type': 'processing-profile',
              'neural_weights_included': False
          }
          (root / 'profile.json').write_text(json.dumps(payload, indent=2), encoding='utf-8')
          (root / 'manifest.json').write_text(json.dumps({
              'schema_version': 1,
              'pack_id': selected,
              'name': profile['name'],
              'version': pack.get('version', '1.0.0'),
              'minimum_app_version': '2.3.0',
              'archive_url': '',
              'archive_sha256': '',
              'files': []
          }, indent=2), encoding='utf-8')
          (root / 'README.txt').write_text(
              f"{profile['name']} {pack.get('version', '1.0.0')}\n\n{profile['description']}\n\n"
              "This specialist profile uses PhotoPerfect's built-in Auto Engine and any installed shared neural core.\n",
              encoding='utf-8'
          )
          PY

      - name: Package selected pack
        shell: bash
        env:
          PACK_ID: ${{ steps.metadata.outputs.pack_id }}
          FILENAME: ${{ steps.metadata.outputs.filename }}
        run: |
          set -euo pipefail
          (cd dist-packs && zip -r "$FILENAME" "$PACK_ID")
          sha256sum "dist-packs/$FILENAME" > "dist-packs/$FILENAME.sha256"

      - name: Upload downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.name }}-${{ steps.metadata.outputs.version }}
          path: |
            dist-packs/${{ steps.metadata.outputs.filename }}
            dist-packs/${{ steps.metadata.outputs.filename }}.sha256
            dist-packs/${{ steps.metadata.outputs.pack_id }}/**

      - name: Publish downloadable pack release
        if: inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: ${{ steps.metadata.outputs.name }} ${{ steps.metadata.outputs.version }}
          body: |
            Downloadable PhotoPerfect Studio Auto pack.

            Auto Restoration Core is a hybrid shared pack: verified neural super resolution plus safe built-in JPEG repair, denoise and deblur profiles. Specialist packs can depend on it without duplicating the model.
          files: |
            dist-packs/${{ steps.metadata.outputs.filename }}
            dist-packs/${{ steps.metadata.outputs.filename }}.sha256
          make_latest: false
