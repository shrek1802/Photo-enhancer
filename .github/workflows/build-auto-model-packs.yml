name: Build Auto Model Packs

on:
  workflow_dispatch:
    inputs:
      pack:
        description: Model pack to build
        required: true
        default: auto-essentials-lite
        type: choice
        options:
          - auto-essentials-lite
          - auto-portrait-pro
          - auto-heritage
          - auto-social-recovery
          - auto-night-recovery
          - auto-vehicle
          - auto-pet-detail
          - auto-document-repair
          - auto-raw-finish
          - auto-event-match
          - auto-background-repair
          - auto-lens-cleanup
          - auto-motion-recovery
          - auto-bw-colour
      publish:
        description: Publish a GitHub Release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pack metadata
        id: metadata
        shell: bash
        env:
          SELECTED_PACK: ${{ inputs.pack }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          selected = os.environ['SELECTED_PACK']
          catalog = json.load(open('model_packs/catalog.json', encoding='utf-8'))
          pack = next((item for item in catalog['packs'] if item['pack_id'] == selected), None)
          if pack is None:
              raise SystemExit(f'Unknown pack: {selected}')
          profiles = json.load(open('model_packs/profiles.json', encoding='utf-8'))['packs']
          profile = profiles.get(selected)
          if selected != 'auto-essentials-lite' and profile is None:
              raise SystemExit(f'Missing processing profile for {selected}')
          display = pack['name']
          version = pack.get('version', '1.0.0')
          filename = display.replace('&', 'and').replace(' ', '-') + f'-{version}.zip'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'pack_id={selected}\n')
              out.write(f'name={display}\n')
              out.write(f'version={version}\n')
              out.write(f'filename={filename}\n')
              out.write(f'tag=auto-pack-{selected}-v{version}\n')
          print(f'Selected: {display} {version}')
          print('Pack type:', 'neural model pack' if selected == 'auto-essentials-lite' else 'installable processing-profile pack')
          PY

      - name: Install ONNX validation tools
        if: inputs.pack == 'auto-essentials-lite'
        run: python -m pip install --upgrade onnx onnxruntime

      - name: Build Auto Essentials Lite neural pack
        if: inputs.pack == 'auto-essentials-lite'
        shell: bash
        run: |
          set -euo pipefail
          PACK_ID=auto-essentials-lite
          ROOT="dist-packs/${PACK_ID}"
          mkdir -p "$ROOT/models"

          curl -L --fail --retry 3 \
            "https://huggingface.co/onnxmodelzoo/super-resolution-10/resolve/395472c4b6b92f788357237983d83fd913cfe7e3/super-resolution-10.onnx?download=true" \
            -o "$ROOT/models/super_resolution.onnx"

          echo "85f36ff88cc504a24af5e0602148bc56a8aa09a58eca8c0da2756f3e8186035e  $ROOT/models/super_resolution.onnx" | sha256sum --check

          python - <<'PY'
          import onnx
          import onnxruntime as ort
          path = 'dist-packs/auto-essentials-lite/models/super_resolution.onnx'
          onnx.checker.check_model(onnx.load(path))
          session = ort.InferenceSession(path, providers=['CPUExecutionProvider'])
          assert session.get_inputs() and session.get_outputs()
          print('Validated:', session.get_inputs()[0].shape, '->', session.get_outputs()[0].shape)
          PY

          SIZE=$(stat -c%s "$ROOT/models/super_resolution.onnx")
          cat > "$ROOT/manifest.json" <<EOF
          {
            "schema_version": 1,
            "pack_id": "auto-essentials-lite",
            "name": "Auto Essentials Lite",
            "version": "1.0.0",
            "minimum_app_version": "2.3.0",
            "archive_url": "https://github.com/${{ github.repository }}/releases/download/auto-pack-auto-essentials-lite-v1.0.0/Auto-Essentials-Lite-1.0.0.zip",
            "archive_sha256": "",
            "files": [
              {
                "capability": "super_resolution",
                "filename": "models/super_resolution.onnx",
                "sha256": "85f36ff88cc504a24af5e0602148bc56a8aa09a58eca8c0da2756f3e8186035e",
                "size": $SIZE,
                "providers": ["CUDAExecutionProvider", "DmlExecutionProvider", "CPUExecutionProvider"],
                "required": true
              }
            ]
          }
          EOF

          cat > "$ROOT/THIRD-PARTY-NOTICES.txt" <<'EOF'
          Auto Essentials Lite includes super-resolution-10.onnx from the ONNX Model Zoo mirror on Hugging Face.
          Model repository: onnxmodelzoo/super-resolution-10
          Pinned revision: 395472c4b6b92f788357237983d83fd913cfe7e3
          License: Apache License 2.0
          Model SHA-256: 85f36ff88cc504a24af5e0602148bc56a8aa09a58eca8c0da2756f3e8186035e
          This model is a lightweight compatibility pack and is not a face-reconstruction model.
          EOF

      - name: Build specialist processing-profile pack
        if: inputs.pack != 'auto-essentials-lite'
        shell: bash
        env:
          SELECTED_PACK: ${{ inputs.pack }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          selected = os.environ['SELECTED_PACK']
          catalog = json.load(open('model_packs/catalog.json', encoding='utf-8'))
          profiles = json.load(open('model_packs/profiles.json', encoding='utf-8'))['packs']
          pack = next(item for item in catalog['packs'] if item['pack_id'] == selected)
          profile = profiles[selected]
          root = Path('dist-packs') / selected
          root.mkdir(parents=True, exist_ok=True)
          (root / 'profile.json').write_text(json.dumps({
              'schema_version': 1,
              'pack_id': selected,
              'name': profile['name'],
              'version': pack.get('version', '1.0.0'),
              'description': profile['description'],
              'scene_hints': profile.get('scene_hints', []),
              'capabilities': profile.get('capabilities', []),
              'settings': profile.get('settings', {}),
              'pack_type': 'processing-profile',
              'neural_weights_included': False
          }, indent=2), encoding='utf-8')
          manifest = {
              'schema_version': 1,
              'pack_id': selected,
              'name': profile['name'],
              'version': pack.get('version', '1.0.0'),
              'minimum_app_version': '2.3.0',
              'archive_url': '',
              'archive_sha256': '',
              'files': []
          }
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          (root / 'README.txt').write_text(
              f"{profile['name']} {manifest['version']}\n\n"
              f"{profile['description']}\n\n"
              "This is a working processing-profile pack. It configures PhotoPerfect's built-in Auto Engine. "
              "It does not yet contain specialist neural reconstruction weights. Those can be added in a later pack update after licence and visual regression testing.\n",
              encoding='utf-8'
          )
          PY

      - name: Package selected pack
        shell: bash
        env:
          PACK_ID: ${{ steps.metadata.outputs.pack_id }}
          FILENAME: ${{ steps.metadata.outputs.filename }}
        run: |
          set -euo pipefail
          (cd dist-packs && zip -r "$FILENAME" "$PACK_ID")
          sha256sum "dist-packs/$FILENAME" > "dist-packs/$FILENAME.sha256"

      - name: Upload downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.name }}-${{ steps.metadata.outputs.version }}
          path: |
            dist-packs/${{ steps.metadata.outputs.filename }}
            dist-packs/${{ steps.metadata.outputs.filename }}.sha256
            dist-packs/${{ steps.metadata.outputs.pack_id }}/manifest.json
            dist-packs/${{ steps.metadata.outputs.pack_id }}/profile.json
            dist-packs/${{ steps.metadata.outputs.pack_id }}/README.txt
            dist-packs/${{ steps.metadata.outputs.pack_id }}/THIRD-PARTY-NOTICES.txt
          if-no-files-found: warn

      - name: Publish downloadable pack release
        if: inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: ${{ steps.metadata.outputs.name }} ${{ steps.metadata.outputs.version }}
          body: |
            Downloadable PhotoPerfect Studio Auto pack.

            Auto Essentials Lite contains a verified Apache-2.0 ONNX super-resolution model.
            Specialist packs currently contain working Auto Engine processing profiles. They do not claim to contain neural reconstruction weights until those weights have passed licensing, compatibility and visual regression checks.
          files: |
            dist-packs/${{ steps.metadata.outputs.filename }}
            dist-packs/${{ steps.metadata.outputs.filename }}.sha256
            dist-packs/${{ steps.metadata.outputs.pack_id }}/manifest.json
            dist-packs/${{ steps.metadata.outputs.pack_id }}/profile.json
            dist-packs/${{ steps.metadata.outputs.pack_id }}/README.txt
            dist-packs/${{ steps.metadata.outputs.pack_id }}/THIRD-PARTY-NOTICES.txt
          make_latest: false
