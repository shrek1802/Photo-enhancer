name: Build PhotoPerfect Studio for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: AMD-DirectML
            runtime: onnxruntime-directml==1.20.1
            exe_name: PhotoPerfect-Studio-AMD-DirectML
          - edition: NVIDIA-CUDA
            runtime: onnxruntime-gpu==1.20.2
            exe_name: PhotoPerfect-Studio-NVIDIA-CUDA

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "${{ matrix.runtime }}"

      - name: Validate source and PhotoPerfect Engine
        shell: pwsh
        run: |
          python -m py_compile app.py enhancer.py photoperfect_engine.py auto_ai_pipeline.py identity_guard.py photo_analysis.py repair_editor.py
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build standalone EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "${{ matrix.exe_name }}" `
            --collect-all cv2 `
            --collect-all PySide6 `
            --collect-all onnxruntime `
            app.py

      - name: Package build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          New-Item -ItemType Directory -Force -Path package/models | Out-Null
          Copy-Item "dist/${{ matrix.exe_name }}.exe" "package/${{ matrix.exe_name }}.exe"
          Copy-Item README.md "package/README.txt"
          Set-Content -Path "package/models/MODEL_PACK_INFO.txt" -Value "PhotoPerfect Studio runs without optional models. Future versioned PhotoPerfect model packs will install into this folder automatically."
          Compress-Archive -Path "package/*" -DestinationPath "${{ matrix.exe_name }}-Windows.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.exe_name }}-Windows
          path: |
            dist/${{ matrix.exe_name }}.exe
            ${{ matrix.exe_name }}-Windows.zip
          if-no-files-found: error

      - name: Publish build to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: studio-v2.0.${{ github.run_number }}
          name: PhotoPerfect Studio v2.0.${{ github.run_number }}
          body: |
            PhotoPerfect Studio with PhotoPerfect Engine v2.

            Engine improvements:
            - Auto Detect now inspects and classifies every image first
            - Dedicated Screenshot Recovery and Black & White Restore plans
            - JPEG artefact, blur, noise, exposure and low-resolution detection
            - Per-image repair plans instead of one generic filter chain
            - Before/after quality validation with rejection of degraded results
            - Identity Lock remains enabled by default
            - Automatic 2x recovery for screenshots and very small images

            Choose AMD DirectML for Radeon cards including RX 6900 XT.
            Choose NVIDIA CUDA for GeForce cards including RTX 2060.
            Both editions retain CPU fallback processing.
          files: |
            dist/${{ matrix.exe_name }}.exe
            ${{ matrix.exe_name }}-Windows.zip
          prerelease: false
          make_latest: true
