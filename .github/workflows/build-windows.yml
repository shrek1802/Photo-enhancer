name: Build PhotoPerfect Studio for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install and test
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m compileall -q .
          pytest -q

  build-windows:
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: onnxruntime-directml==1.20.1
            exe_name: PhotoPerfect-Studio-AMD-DirectML
          - runtime: onnxruntime-gpu==1.20.2
            exe_name: PhotoPerfect-Studio-NVIDIA-CUDA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "${{ matrix.runtime }}"
      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "${{ matrix.exe_name }}" `
            --collect-all cv2 `
            --collect-all PySide6 `
            --collect-all onnxruntime `
            --hidden-import model_manager `
            --hidden-import photoperfect_engine `
            app.py
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/models/packs/auto-essentials | Out-Null
          Copy-Item "dist/${{ matrix.exe_name }}.exe" "package/${{ matrix.exe_name }}.exe"
          Copy-Item README.md "package/README.txt"
          Copy-Item "models/packs/auto-essentials/manifest.json" "package/models/packs/auto-essentials/manifest.json"
          Compress-Archive -Path "package/*" -DestinationPath "${{ matrix.exe_name }}-Windows.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.exe_name }}-Windows
          path: |
            dist/${{ matrix.exe_name }}.exe
            ${{ matrix.exe_name }}-Windows.zip
      - name: Publish Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: studio-v2.2.${{ github.run_number }}
          name: PhotoPerfect Studio v2.2.${{ github.run_number }}
          body: |
            Phase 2A Auto release.

            - Auto Detect, Auto Enhance and Auto Restore branding
            - visible app and Auto Engine versions
            - Auto Essentials 1.0 versioned pack structure
            - live image type, repair pipeline, detected problems and quality report
            - Face Identity Lock enabled by default
            - AMD DirectML and NVIDIA CUDA editions

            Auto Essentials 1.0 currently establishes the secure model-pack framework. No fake or unlicensed neural weights are included.
          files: |
            dist/${{ matrix.exe_name }}.exe
            ${{ matrix.exe_name }}-Windows.zip
          make_latest: true
