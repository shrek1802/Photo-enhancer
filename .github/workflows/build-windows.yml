name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build standalone EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "PhotoPerfect-Batch-AI" `
            --collect-all cv2 `
            --collect-all PySide6 `
            app.py

      - name: Package build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "dist/PhotoPerfect-Batch-AI.exe" "package/PhotoPerfect-Batch-AI.exe"
          Copy-Item README.md "package/README.txt"
          Compress-Archive -Path "package/*" -DestinationPath "PhotoPerfect-Batch-AI-Windows.zip" -Force

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoPerfect-Batch-AI-Windows
          path: |
            dist/PhotoPerfect-Batch-AI.exe
            PhotoPerfect-Batch-AI-Windows.zip
          if-no-files-found: error

      - name: Publish build to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: PhotoPerfect Batch AI v0.1.${{ github.run_number }}
          body: |
            Automatic Windows 11 build of PhotoPerfect Batch AI.

            Download either the standalone EXE or the ZIP package below.
          files: |
            dist/PhotoPerfect-Batch-AI.exe
            PhotoPerfect-Batch-AI-Windows.zip
          prerelease: false
          make_latest: true
