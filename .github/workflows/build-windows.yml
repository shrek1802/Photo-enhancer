name: Build PhotoPerfect Studio for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile source
        shell: pwsh
        run: python -m compileall -q .
      - name: Run engine and capability regression tests
        shell: pwsh
        run: pytest -q

  build-windows:
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: AMD-DirectML
            runtime: onnxruntime-directml==1.20.1
            exe_name: PhotoPerfect-Studio-AMD-DirectML
          - edition: NVIDIA-CUDA
            runtime: onnxruntime-gpu==1.20.2
            exe_name: PhotoPerfect-Studio-NVIDIA-CUDA

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "${{ matrix.runtime }}"

      - name: Build standalone EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "${{ matrix.exe_name }}" `
            --collect-all cv2 `
            --collect-all PySide6 `
            --collect-all onnxruntime `
            --hidden-import model_manager `
            --hidden-import capability_runtime `
            app.py

      - name: Package build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          New-Item -ItemType Directory -Force -Path package/models | Out-Null
          New-Item -ItemType Directory -Force -Path package/model_packs | Out-Null
          Copy-Item "dist/${{ matrix.exe_name }}.exe" "package/${{ matrix.exe_name }}.exe"
          Copy-Item README.md "package/README.txt"
          Copy-Item "model_packs/essentials-manifest.template.json" "package/model_packs/essentials-manifest.template.json"
          Set-Content -Path "package/models/MODEL_PACK_INFO.txt" -Value "PhotoPerfect Studio v3 loads specialist ONNX capabilities from independently versioned model packs. Missing models fall back safely to the built-in Phase 2 engine."
          Compress-Archive -Path "package/*" -DestinationPath "${{ matrix.exe_name }}-Windows.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.exe_name }}-Windows
          path: |
            dist/${{ matrix.exe_name }}.exe
            ${{ matrix.exe_name }}-Windows.zip
          if-no-files-found: error

      - name: Publish build to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: studio-v3.0.${{ github.run_number }}
          name: PhotoPerfect Studio v3.0.${{ github.run_number }}
          body: |
            PhotoPerfect Studio Phase 3 for Windows 11.

            Phase 3 foundation:
            - specialist model capabilities selected from each repair plan
            - JPEG repair, denoise, deblur, colour and super-resolution capability routing
            - tiled ONNX inference for large photographs
            - CUDA, DirectML and CPU provider selection
            - safe fallback when a model is missing, incompatible or fails inference
            - independent model-pack updates remain SHA-256 verified
            - Face Identity Lock remains enabled by default
            - Phase 2 and Phase 3 regression tests must pass before Windows builds

            This release contains the model runtime and pack system, but does not
            falsely bundle unlicensed or placeholder AI weights. Genuine model packs
            will be released separately once validated.

            Choose AMD DirectML for Radeon cards including RX 6900 XT.
            Choose NVIDIA CUDA for GeForce cards including RTX 2060.
            Both editions retain CPU fallback processing.
          files: |
            dist/${{ matrix.exe_name }}.exe
            ${{ matrix.exe_name }}-Windows.zip
          prerelease: false
          make_latest: true
