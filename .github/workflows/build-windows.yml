name: Build PhotoPerfect Studio for Windows

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the completed builds to GitHub Releases
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install and test
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m compileall -q .
          pytest -q

  build-windows:
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: onnxruntime-directml==1.20.1
            exe_name: PhotoPerfect-Studio-AMD-DirectML
          - runtime: onnxruntime-gpu==1.20.2
            exe_name: PhotoPerfect-Studio-NVIDIA-CUDA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "${{ matrix.runtime }}"
      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "${{ matrix.exe_name }}" `
            --collect-all cv2 `
            --collect-all PySide6 `
            --collect-all onnxruntime `
            --hidden-import model_manager `
            --hidden-import capability_runtime `
            --hidden-import photoperfect_engine `
            --hidden-import photoperfect_intelligence `
            --hidden-import auto_model_manager_dialog `
            --hidden-import version_info `
            app.py
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/models/packs | Out-Null
          New-Item -ItemType Directory -Force -Path package/model_packs | Out-Null
          Copy-Item "dist/${{ matrix.exe_name }}.exe" "package/${{ matrix.exe_name }}.exe"
          Copy-Item README.md "package/README.txt"
          Copy-Item "model_packs/essentials-manifest.template.json" "package/model_packs/auto-essentials-manifest.template.json"
          Set-Content -Path "package/models/AUTO_MODEL_PACKS.txt" -Value "Use Auto Model Manager inside PhotoPerfect Studio to install checksum-verified Auto model packs. Built-in restoration remains available without external models."
          Compress-Archive -Path "package/*" -DestinationPath "${{ matrix.exe_name }}-Windows.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.exe_name }}-Windows
          path: |
            dist/${{ matrix.exe_name }}.exe
            ${{ matrix.exe_name }}-Windows.zip
      - name: Publish Release
        if: inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: studio-v2.3.${{ github.run_number }}
          name: PhotoPerfect Studio v2.3.${{ github.run_number }}
          body: |
            Manual PhotoPerfect Studio Windows release.

            - Auto Model Manager for secure ZIP or manifest-based installation
            - Auto Face Recovery and Auto Face Protect region processing
            - fixed-size and dynamic ONNX model input support
            - safer feathered face relighting
            - faces, hair and nearby clothing protected from flare inpainting
            - installed Auto Super Resolution used directly when available
            - detailed per-image pipeline, models, problems and quality results
            - AMD DirectML and NVIDIA CUDA editions

            Model weights remain separate release assets and no fake or unlicensed weights are included.
          files: |
            dist/${{ matrix.exe_name }}.exe
            ${{ matrix.exe_name }}-Windows.zip
          make_latest: true
